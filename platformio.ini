[env:waveshare_esp32_s3_touch_amoled_241]
; The Arduino_GFX CO5300 driver pulls in esp32-hal-periman.h, which only
; exists in Arduino-ESP32 core ≥3.x. The official PlatformIO espressif32
; platform still ships core 2.x, so we use the pioarduino fork that tracks
; current Espressif releases. Git ref keeps the checkout small — toolchains
; are pulled lazily on first build.
platform        = https://github.com/pioarduino/platform-espressif32.git#55.03.38-1
board           = esp32-s3-devkitc-1
framework       = arduino

; The board is an ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM.
; esp32-s3-devkitc-1 defaults to 8 MB flash, so override:
board_upload.flash_size = 16MB
board_build.flash_size  = 16MB
board_build.partitions  = default_16MB.csv
board_build.psram_type  = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0

monitor_speed = 115200
